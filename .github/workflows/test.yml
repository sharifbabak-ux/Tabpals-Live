name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tabpals
          POSTGRES_PASSWORD: tabpals
          POSTGRES_DB: tabpals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tabpals -d tabpals_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tests (pg-mem)
        run: npm test
      - name: Tests (real PostgreSQL 16)
        run: npm test
        env:
          DATABASE_URL_TEST: postgres://tabpals:tabpals@localhost:5432/tabpals_test
