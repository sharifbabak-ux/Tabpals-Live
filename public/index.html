<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تست اتصال تب‌پالز</title>
<style>
  :root { --bg:#F3EDDF; --ink:#26261F; --olive:#4E5D2F; --gold:#B8913A; --card:#fffaf0; --line:#d9cfb8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: Tahoma, "Segoe UI", system-ui, sans-serif; line-height:1.6; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 12px; color:var(--olive); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  .status { display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; font-size:14px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#b33; margin-inline-start:6px; }
  .dot.on { background:#3a8a3a; }
  input { width:100%; padding:10px; font-size:16px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); font-family:inherit; }
  .row { display:flex; gap:8px; margin-top:8px; }
  .row > * { flex:1; }
  button { padding:10px 12px; font-size:15px; border:0; border-radius:8px; background:var(--olive); color:#fff; font-family:inherit; cursor:pointer; }
  button.gold { background:var(--gold); }
  button.ghost { background:transparent; color:var(--olive); border:1px solid var(--olive); }
  button:disabled { opacity:.5; cursor:default; }
  .code { font-size:44px; letter-spacing:8px; text-align:center; color:var(--olive); font-weight:bold; direction:ltr; font-family:ui-monospace, Consolas, monospace; }
  #members { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 0; padding:0; list-style:none; }
  #members li { background:var(--bg); border:1px solid var(--gold); border-radius:999px; padding:2px 10px; font-size:14px; }
  #msgs { height:220px; overflow-y:auto; background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px; margin-top:8px; }
  .m { margin-bottom:6px; font-size:15px; overflow-wrap:anywhere; }
  .m b { color:var(--olive); } .m small { color:#777; margin-inline-start:6px; }
  .err { color:#a22; font-size:14px; min-height:20px; margin-top:6px; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>تست اتصال زنده تب‌پالز</h1>

  <div class="card status">
    <div>وضعیت: <b id="st">قطع</b><span class="dot" id="dot"></span></div>
    <div>مسیر: <b id="tr">—</b></div>
    <div>تأخیر: <b id="lat">—</b></div>
    <div>میانگین: <b id="avg">—</b></div>
    <div>اتصال مجدد: <b id="rc">۰</b></div>
    <div>ارسال/دریافت: <b id="cnt">۰/۰</b></div>
  </div>

  <div id="lobby" class="card">
    <label for="name">نام شما</label>
    <input id="name" maxlength="24" autocomplete="off">
    <div class="row"><button id="create">ساخت اتاق</button></div>
    <div class="row">
      <input id="code" maxlength="6" placeholder="کد اتاق" autocomplete="off" style="direction:ltr;text-transform:uppercase">
      <button id="join" class="gold">ورود به اتاق</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <div id="room" class="card hidden">
    <div class="code" id="roomcode"></div>
    <ul id="members"></ul>
    <div id="msgs"></div>
    <div class="row">
      <input id="text" maxlength="500" placeholder="پیام..." autocomplete="off">
      <button id="send" style="flex:0 0 auto">ارسال</button>
    </div>
    <div class="row"><button id="leave" class="ghost">خروج از اتاق</button></div>
  </div>

  <div class="card">
    <button id="report" class="gold" style="width:100%">کپی گزارش</button>
    <div class="err" id="repmsg" style="color:var(--olive)"></div>
  </div>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var fa = function (n) { return String(n).replace(/\d/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'[d]; }); };
  var ERR = { 'not-found':'اتاقی با این کد پیدا نشد.', 'room-full':'اتاق پر است.', 'bad-name':'نام را وارد کنید.',
              'rate-limit':'ارسال بیش از حد سریع است.', 'too-long':'پیام خیلی طولانی است.', 'not-in-room':'در اتاق نیستید.' };
  var s = { sent:0, recv:0, reconnects:0, lat:[], room:null };
  var socket = io('/test', { transports:['polling','websocket'], reconnection:true, reconnectionDelayMax:5000 });

  function render() {
    $('cnt').textContent = fa(s.recv) + '/' + fa(s.sent);
    $('rc').textContent = fa(s.reconnects);
  }
  function stats() {
    if (!s.lat.length) return null;
    var sum = s.lat.reduce(function (a, b) { return a + b; }, 0);
    return { avg: Math.round(sum / s.lat.length), min: Math.min.apply(null, s.lat), max: Math.max.apply(null, s.lat) };
  }
  function transport() { return socket.connected ? socket.io.engine.transport.name : '—'; }
  function setConn(on) {
    $('st').textContent = on ? 'متصل' : 'قطع';
    $('dot').className = 'dot' + (on ? ' on' : '');
    $('tr').textContent = on ? transport() : '—';
  }
  socket.on('connect', function () {
    setConn(true);
    socket.io.engine.on('upgrade', function () { $('tr').textContent = transport(); });
    // rejoin after a reconnect: new socket id means server dropped membership
    if (s.room) {
      socket.emit('join-room', { code: s.room.code, name: s.room.name }, function (r) {
        if (r && r.ok) setMembers(r.members); else showLobby('اتاق دیگر وجود ندارد.');
      });
    }
  });
  socket.on('disconnect', function () { setConn(false); });
  socket.io.on('reconnect_attempt', function (n) { $('st').textContent = 'تلاش مجدد ' + fa(n); });
  socket.io.on('reconnect', function () { s.reconnects++; render(); });

  function ping() {
    if (!socket.connected) return;
    var t = performance.now();
    socket.emit('ping-test', function () {
      var ms = Math.round(performance.now() - t);
      s.lat.push(ms);
      var st = stats();
      $('lat').textContent = fa(ms) + ' ms';
      $('avg').textContent = fa(st.avg) + ' ms';
      $('tr').textContent = transport();
    });
  }
  setInterval(ping, 3000);
  socket.on('connect', ping);

  function showLobby(msg) {
    s.room = null;
    $('room').classList.add('hidden'); $('lobby').classList.remove('hidden');
    $('err').textContent = msg || '';
  }
  function setMembers(list) {
    var ul = $('members'); ul.innerHTML = '';
    list.forEach(function (n) { var li = document.createElement('li'); li.textContent = n; ul.appendChild(li); });
  }
  function enter(r, name) {
    s.room = { code: r.code, name: name };
    $('roomcode').textContent = r.code;
    $('msgs').innerHTML = '';
    setMembers(r.members);
    $('lobby').classList.add('hidden'); $('room').classList.remove('hidden');
  }
  function go(ev, extra) {
    var name = $('name').value.trim();
    if (!name) { $('err').textContent = ERR['bad-name']; return; }
    var p = { name: name }; for (var k in extra) p[k] = extra[k];
    socket.emit(ev, p, function (r) {
      if (r && r.ok) { $('err').textContent = ''; enter(r, name); }
      else $('err').textContent = ERR[r && r.error] || 'خطا';
    });
  }
  $('create').onclick = function () { go('create-room', {}); };
  $('join').onclick = function () { go('join-room', { code: $('code').value.trim().toUpperCase() }); };
  $('leave').onclick = function () { socket.emit('leave-room', {}, function () { showLobby(''); }); };
  function send() {
    var t = $('text').value;
    if (!t.trim()) return;
    socket.emit('message', { text: t }, function (r) {
      if (r && r.ok) { s.sent++; render(); $('text').value = ''; }
      else $('err').textContent = ERR[r && r.error] || 'خطا';
    });
  }
  $('send').onclick = send;
  $('text').onkeydown = function (e) { if (e.key === 'Enter') send(); };

  socket.on('members', function (d) { setMembers(d.members); });
  socket.on('room-closed', function () { showLobby('اتاق بسته شد.'); });
  socket.on('message', function (m) {
    s.recv++; render();
    var d = document.createElement('div'); d.className = 'm';
    var b = document.createElement('b'); b.textContent = m.name;
    var t = document.createElement('small'); t.textContent = new Date(m.time).toLocaleTimeString('fa-IR');
    d.appendChild(b); d.appendChild(t); d.appendChild(document.createElement('br'));
    d.appendChild(document.createTextNode(m.text));
    var box = $('msgs'); box.appendChild(d); box.scrollTop = box.scrollHeight;
  });

  $('report').onclick = function () {
    var st = stats();
    var txt = [
      'گزارش تست اتصال تب‌پالز',
      'زمان: ' + new Date().toLocaleString('fa-IR'),
      'مسیر اتصال: ' + (socket.connected ? transport() : 'قطع'),
      'تأخیر (میانگین/کمترین/بیشترین): ' + (st ? st.avg + ' / ' + st.min + ' / ' + st.max + ' ms' : 'نامشخص') + ' (' + s.lat.length + ' نمونه)',
      'پیام ارسالی: ' + s.sent + ' | دریافتی: ' + s.recv,
      'تعداد اتصال مجدد: ' + s.reconnects
    ].join('\n');
    function done(ok) { $('repmsg').textContent = ok ? 'گزارش کپی شد.' : 'کپی نشد؛ متن را دستی کپی کنید.'; if (!ok) prompt('گزارش', txt); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(function () { done(true); }, function () { done(false); });
    else {
      var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); done(ok);
    }
  };
  render();
})();
</script>
</body>
</html>
